{% extends "base.html" %}

{% block title %}Housekeeping — FAIR Questionnaire{% endblock %}
{% block page_title %}Housekeeping{% endblock %}

{% block content %}
<form id="housekeeping-form">
    <div id="hardCase" class="form-group">
        <label for="hardCase" class="question-label">Did you have a difficult time voting on this case?</label>
        <div style="display: block; margin-bottom: 4px;">
            <input type="radio" id="hardCaseYes" name="hardCase" value="yes" onclick="document.getElementById('whyHardCase').style.display='block'" required> Yes
        </div>

        <div style="display: block; margin-bottom: 4px;">
            <input type="radio" id="hardCaseNo" name="hardCase" value="no" onclick="document.getElementById('whyHardCase').style.display='none'" required> No
        </div>
    </div>

    <div id="whyHardCase" class="form-group" style="display: none;">
        <label class="question-label">Why was this vote difficult?</label>
        <div style="display: block; margin-bottom: 4px;">
            <input type="radio" id="why1" name="whyHardCase" value="yes"> Not enough information
        </div>

        <div style="display: block; margin-bottom: 4px;">
            <input type="radio" id="why2" name="whyHardCase" value="no"> Credibility unclear
        </div>

        <div style="display: block; margin-bottom: 4px;">
            <input type="radio" id="why3" name="whyHardCase" value="no"> Other
        </div>
        <input type="text" id="otherText" name="other" style="display: block; margin-bottom: 8px;">
    </div>

    <div id="medicalProvider" class="form-group">
        <label for="medicalProvider" class="question-label">Was there a medical provider on committee?</label>
        <div style="display: block; margin-bottom: 4px;">
            <input type="radio" id="medicalProviderYes" name="medicalProvider" value="yes" required> Yes
        </div>

    <div style="display: block; margin-bottom: 4px;">
        <input type="radio" id="medicalProviderNo" name="medicalProvider" value="no" required> No
    </div>
</div>
<div class="button-group">
        <button id="btn-back" class="back-btn" type="button">Back</button>
        <button class="next-btn" type="submit">Next</button>
</div>

</form>

<script>
    // Restore previous progress
    const saved = localStorage.getItem('housekeeping');
    if (saved) {
        const fields = JSON.parse(saved);
        if (fields.hard_case) {
            const radio = document.querySelector(`input[name="hardCase"][value="${fields.hard_case}"]`);
            if (radio) radio.click();
        }
        if (fields.why_hard_case) {
            const radio = document.querySelector(`input[name="whyHardCase"][value="${fields.why_hard_case}"]`);
            if (radio) radio.checked = true;
        }
        if (fields.why_hard_case_other) {
            document.getElementById('otherText').value = fields.why_hard_case_other;
        }
        if (fields.medical_provider) {
            const radio = document.querySelector(`input[name="medicalProvider"][value="${fields.medical_provider}"]`);
            if (radio) radio.checked = true;
        }
    }

    // Redirect to confirmation: 1. save record to database; 2. clear all local storage
    document.getElementById('housekeeping-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        // Collect housekeeping fields
        const hardCaseEl      = document.querySelector('input[name="hardCase"]:checked');
        const whyHardCaseEl   = document.querySelector('input[name="whyHardCase"]:checked');
        const medProviderEl   = document.querySelector('input[name="medicalProvider"]:checked');

        const housekeeping = {
            hard_case:            hardCaseEl     ? hardCaseEl.value     : null,
            why_hard_case:        whyHardCaseEl  ? whyHardCaseEl.value  : null,
            why_hard_case_other:  document.getElementById('otherText').value.trim() || null,
            medical_provider:     medProviderEl  ? medProviderEl.value  : null,
        };

        const maltreatmentCategory = JSON.parse(localStorage.getItem('maltreatment_category') || '{}');
        const allMedicalForms = JSON.parse(localStorage.getItem('medical_form') || '{}');
        const typeKey = (maltreatmentCategory.maltreatment_type || '').replace(/-/g, '_');
        const submittedMedicalForm = typeKey ? (allMedicalForms[typeKey] || {}) : {};

        const payload = {
            submitted_at: new Date().toISOString(),
            data: {
                basic_info:            JSON.parse(localStorage.getItem('basic_info')            || '{}'),
                maltreatment_category: maltreatmentCategory,
                medical_form:          submittedMedicalForm,
                housekeeping:          housekeeping,
            }
        };

        // POST request to save data
        const response = await fetch('/confirmation', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify(payload)
        });

        if (response.ok) {
            // Clear all local storage data data
            localStorage.removeItem('basic_info');
            localStorage.removeItem('maltreatment_category');
            localStorage.removeItem('medical_form');
            localStorage.removeItem('housekeeping');

            // Redirect to confirmation page 
            window.location.href = '/confirmation';
        } else {
            alert('There was an error saving your submission. Please try again.');
        }
    });
</script>

{% endblock %}
