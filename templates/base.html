<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FAIR Questionnaire{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header>
    <div class="header-inner">
      <img
        class="header-logo"
        src="{{ url_for('static', filename='assets/Nyu_short_color.svg.png') }}"
        alt="NYU"
      >
      <h1 class="page-heading">
        <span class="breadcrumb-root">FAIR Questionnaire</span>
        <span class="breadcrumb-sep"> / </span>
        <span class="breadcrumb-current">{% block page_title %}{% endblock %}</span>
      </h1>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
